# Publish workflow for the public api-sdk-typescript repo.
# Managed by the SDK Release workflow in the API monorepo — do not edit directly.
#
# Triggered by a tag pushed from the monorepo:
#   vX.Y.Z              → stable    → npm dist-tag `latest`
#   vX.Y.Z-nightly.<ts> → prerelease → npm dist-tag `nightly`
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN. Node 24 gives the runner
# npm 11+ for the OIDC handshake. Install/build run on bun (matches the monorepo).
#   Configure at https://www.npmjs.com/package/@swapkit/api-sdk-typescript/access
#   Trusted Publisher → swapkit/api-sdk-typescript → release.yml

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # npm OIDC trusted publishing
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Validated v${PKG_VERSION}"

      # Node 24 → npm 11+, required for the OIDC trusted-publishing handshake.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" == *-* ]]; then DIST_TAG="nightly"; else DIST_TAG="latest"; fi
          echo "Publishing v${TAG_VERSION} to dist-tag '${DIST_TAG}'"
          npm publish --access public --tag "$DIST_TAG"

      # A GitHub release per stable version (skipped for nightly prereleases).
      - name: Create GitHub release
        if: ${{ !contains(github.ref, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --title "${GITHUB_REF#refs/tags/}"
