# Publish workflow for the public api-sdk-typescript repo.
# Managed by the SDK Sync workflow in the API monorepo — do not edit directly.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Requires npm CLI v11+ for OIDC support.
# Configure at: https://www.npmjs.com/package/@swapkit/api-sdk-typescript/access
#   Trusted Publisher → swapkit/api-sdk-typescript → release.yml

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use stable semver format vX.Y.Z"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Validated v${PKG_VERSION}"

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
